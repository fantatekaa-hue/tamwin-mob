name: Build Standalone Android APK

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Build web assets for offline APK bundle
        run: npm run build

      - name: Install Capacitor Android tools (temporary, without modifying package.json)
        run: |
          npm install --no-save --legacy-peer-deps \
            @capacitor/core@^7.0.0 \
            @capacitor/cli@^7.0.0 \
            @capacitor/android@^7.0.0 \
            @capacitor/filesystem@^7.0.0 \
            @capacitor/share@^7.0.0

      - name: Generate Android project
        run: npx cap add android

      - name: Apply custom app icon
        run: |
          RES_DIR="android/app/src/main/res"
          rm -rf "$RES_DIR/mipmap-anydpi-v26"
          for pair in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${pair%%:*}"
            size="${pair##*:}"
            mkdir -p "$RES_DIR/mipmap-$density"
            if command -v convert >/dev/null 2>&1; then
              convert public/pwa-512x512.png -resize "${size}x${size}" "$RES_DIR/mipmap-$density/ic_launcher.png"
              convert public/pwa-512x512.png -resize "${size}x${size}" "$RES_DIR/mipmap-$density/ic_launcher_round.png"
              convert public/pwa-512x512.png -resize "${size}x${size}" "$RES_DIR/mipmap-$density/ic_launcher_foreground.png"
            else
              cp public/pwa-512x512.png "$RES_DIR/mipmap-$density/ic_launcher.png"
              cp public/pwa-512x512.png "$RES_DIR/mipmap-$density/ic_launcher_round.png"
              cp public/pwa-512x512.png "$RES_DIR/mipmap-$density/ic_launcher_foreground.png"
            fi
          done

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build standalone APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare output APK
        run: |
          mkdir -p release-android
          cp android/app/build/outputs/apk/debug/app-debug.apk release-android/Tamween-Assistant.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tamween-Assistant-Android-APK
          path: release-android/Tamween-Assistant.apk

      - name: Publish direct APK download on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-apk --yes --cleanup-tag || true
          gh release create android-apk release-android/Tamween-Assistant.apk \
            --title "نسخة أندرويد المستقلة (APK) — مساعد استعاضة التموين" \
            --notes "تطبيق أندرويد مستقل بالكامل يعمل بدون متصفح وبدون إنترنت (لا يتأثر بمسح سجل أو بيانات المتصفح)."
